<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f97316">
  <title>飲み会ミニゲーム</title>
  <link rel="stylesheet" href="styles.css?v=20260508-8">
</head>
<body>
  <main class="app">
    <section class="hero" aria-labelledby="app-title">
      <p class="eyebrow">名前を入れてすぐ遊べる</p>
      <h1 id="app-title">飲み会ミニゲーム</h1>
      <p class="lead">参加者の名前を1行に1人ずつ入力して、ルーレット、あみだくじ、爆弾ゲーム、王様ゲーム、順番決めをその場で遊べます。</p>
    </section>

    <div class="layout">
      <aside class="panel setup">
        <h2 class="panel-title">
          参加者名
          <span class="count-pill" id="participant-count">0人</span>
        </h2>
        <details class="participant-editor">
          <summary>参加者を編集</summary>
          <textarea id="names-input" aria-label="参加者名入力欄" placeholder="勝木&#10;合原&#10;佐藤大樹&#10;まる&#10;村本"></textarea>
        </details>
        <div class="participant-strip" id="participant-strip" aria-label="参加者一覧"></div>
        <div class="error" id="error" role="alert" aria-live="polite"></div>

        <div class="games" role="tablist" aria-label="ゲーム選択">
          <button class="game-tab" type="button" data-game="roulette" role="tab" aria-selected="true">ルーレット</button>
          <button class="game-tab" type="button" data-game="amidakuji" role="tab" aria-selected="false">あみだくじ</button>
          <button class="game-tab" type="button" data-game="bomb" role="tab" aria-selected="false">爆弾ゲーム</button>
          <button class="game-tab" type="button" data-game="king" role="tab" aria-selected="false">王様ゲーム</button>
          <button class="game-tab" type="button" data-game="order" role="tab" aria-selected="false">順番決め</button>
        </div>

        <p class="note">飲酒は無理せず、飲まない人にも配慮して遊んでください。<br>このアプリは飲酒を強制するものではなく、場を盛り上げるための抽選ツールです。</p>
      </aside>

      <section class="panel stage" aria-live="polite">
        <div class="stage-head">
          <div>
            <h2 id="game-title">ルーレット</h2>
            <p class="hint" id="game-hint">参加者の名前が入ったルーレットを回して、止まった人を選びます。</p>
          </div>
          <button class="primary-button" type="button" id="start-button">回す</button>
        </div>
        <div class="visual" id="visual"></div>
        <div class="result" id="result">名前を入力して開始</div>
      </section>
    </div>
  </main>
  <canvas class="confetti-canvas" id="confetti-canvas" aria-hidden="true"></canvas>

  <script src="app.js?v=20260508-8" defer></script>
</body>
</html>
